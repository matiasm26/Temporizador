<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SERVICE SKILL CONTEST · CHILE — panel local de temporizadores">
  <title>SERVICE SKILL CONTEST · CHILE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4 py-lg-5">
    <header class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
      <div>
        <h1 class="mb-1">SERVICE SKILL CONTEST</h1>
      </div>
      <div class="d-flex gap-2">
        <button id="startAll" class="btn btn-primary">Iniciar todos</button>
        <button id="pauseAll" class="btn btn-outline-secondary">Pausar todos</button>
        <button id="resetAll" class="btn btn-outline-danger">Reiniciar todos</button>
      </div>
    </header>

    <div class="timer-layout">
      <div id="secondaryTimersLeft" class="secondary-column" aria-label="Temporizadores 1 a 4"></div>

      <section id="mainTimer" class="timer-panel main-panel" data-timer-id="main" aria-labelledby="mainTimerTitle">
        <div class="panel-header">
          <div>
            <span class="badge rounded-pill text-bg-primary mb-2">PRINCIPAL</span>
          </div>
          <span class="status-badge" data-status>Listo</span>
        </div>
        <div class="main-clock">
          <div class="progress timer-progress" role="progressbar" aria-label="Tiempo restante del temporizador principal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="progress-bar" data-progress></div>
          </div>
          <div class="main-display">
            <span class="clock-time" data-display>05:00</span>
            <span class="remaining-label">Tiempo restante</span>
          </div>
        </div>
        <div class="timer-controls mt-4">
          <div class="duration-fields" aria-label="Duración del temporizador principal">
            <label>Minutos <input class="form-control" type="number" min="0" max="999" value="5" data-minutes></label>
            <span>:</span>
            <label>Segundos <input class="form-control" type="number" min="0" max="59" value="0" data-seconds></label>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary btn-lg" data-action="toggle">Iniciar</button>
            <button class="btn btn-outline-secondary btn-lg" data-action="reset">Reiniciar</button>
          </div>
        </div>
      </section>

      <div id="secondaryTimersRight" class="secondary-column" aria-label="Temporizadores 5 a 8"></div>
    </div>

    <section class="visually-hidden" aria-labelledby="secondaryTimersTitle">
      <h2 id="secondaryTimersTitle">Tiempo por participante</h2>
    </section>

    <footer class="text-center text-secondary small mt-4">Los temporizadores funcionan localmente en este navegador.</footer>

  </main>
  <script src="app.js"></script>
</body>
</html>
